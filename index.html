<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liquid Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --bg-base: #f4f6fa;
      --glass-bg: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.45);
      --glass-inner: rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #007aff;
      --accent-glow: rgba(0, 122, 255, 0.28);
      --user-bubble: rgba(0, 122, 255, 0.88);
      --ai-bubble: var(--glass-bg);
      --code-bg: rgba(245, 247, 250, 0.75);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --transition: 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      --font-stack: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg-base: #0a0a10;
      --glass-bg: rgba(22, 24, 35, 0.62);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-inner: rgba(255, 255, 255, 0.05);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      --text-primary: #f5f7fa;
      --text-secondary: #9ca3b4;
      --text-muted: #6b7280;
      --accent: #0a84ff;
      --accent-glow: rgba(10, 132, 255, 0.32);
      --user-bubble: rgba(10, 132, 255, 0.82);
      --ai-bubble: var(--glass-bg);
      --code-bg: rgba(15, 18, 28, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-stack);
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100dvh;
      overflow: hidden;
      transition: background var(--transition), color var(--transition);
      position: relative;
    }

    /* Animated Liquid Background */
    .bg-orbs {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55;
      animation: float 20s infinite ease-in-out alternate;
    }
    .orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, var(--accent), transparent); top: -10%; left: -10%; animation-delay: 0s; }
    .orb-2 { width: 450px; height: 450px; background: radial-gradient(circle, #8b5cf6, transparent); bottom: -15%; right: -5%; animation-delay: -7s; }
    .orb-3 { width: 380px; height: 380px; background: radial-gradient(circle, #10b981, transparent); top: 40%; left: 60%; animation-delay: -14s; }
    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, -20px) scale(1.15); } }

    /* Glass Utilities */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-inner);
    }

    /* Layout */
    .app { display: flex; height: 100dvh; max-width: 1440px; margin: 0 auto; position: relative; }
    
    /* Sidebar */
    .sidebar {
      width: 280px; padding: 16px; display: flex; flex-direction: column; gap: 16px;
      border-right: 1px solid var(--glass-border);
      transition: transform var(--transition), width var(--transition);
      z-index: 20;
    }
    .sidebar-header { display: flex; gap: 8px; align-items: center; }
    .btn {
      background: var(--accent); color: white; border: none; padding: 10px 14px;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500;
      transition: all var(--transition); flex: 1;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.ghost { background: transparent; color: var(--text-secondary); box-shadow: none; }
    .btn.ghost:hover { background: rgba(128,128,128,0.15); }

    .chat-list {
      flex: 1; overflow-y: auto; padding-right: 6px;
      scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent;
    }
    .chat-item {
      padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 13.5px; color: var(--text-secondary); margin-bottom: 4px;
      display: flex; justify-content: space-between; align-items: center;
      transition: all var(--transition); position: relative;
    }
    .chat-item:hover { background: rgba(128,128,128,0.12); color: var(--text-primary); }
    .chat-item.active { background: rgba(128,128,128,0.18); color: var(--text-primary); font-weight: 550; }
    .chat-item .del {
      opacity: 0; background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: all var(--transition);
    }
    .chat-item:hover .del { opacity: 1; }
    .chat-item .del:hover { color: #ef4444; background: rgba(239,68,68,0.15); }

    /* Main */
    .main {
      flex: 1; display: flex; flex-direction: column; position: relative;
      background: transparent;
    }
    .topbar {
      padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; font-size: 16px; border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 10;
    }
    .mobile-toggle {
      display: none; background: none; border: none; color: var(--text-primary); cursor: pointer; padding: 6px;
    }

    #messages {
      flex: 1; overflow-y: auto; padding: 24px 20px 100px;
      display: flex; flex-direction: column; gap: 18px;
      scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent;
    }

    .msg {
      max-width: 82%; padding: 14px 18px; border-radius: var(--radius-md);
      line-height: 1.65; font-size: 14.5px; word-wrap: break-word;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .msg.user { align-self: flex-end; background: var(--user-bubble); color: white; border: 1px solid rgba(255,255,255,0.25); border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: var(--ai-bubble); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }

    /* Markdown & Code */
    .msg.ai p { margin: 8px 0; }
    .msg.ai ul, .msg.ai ol { margin-left: 20px; margin-bottom: 8px; }
    .msg.ai strong { font-weight: 600; }
    
    .code-container { margin: 12px 0; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--glass-border); }
    .code-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; font-size: 11px; font-weight: 500; color: var(--text-secondary);
      border-bottom: 1px solid var(--glass-border); background: var(--code-bg);
    }
    .code-copy {
      background: transparent; border: 1px solid var(--glass-border); color: var(--text-secondary);
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 500;
      transition: all var(--transition); display: flex; align-items: center; gap: 5px;
    }
    .code-copy:hover { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-1px); }
    .code-copy.copied { background: #10b981; color: white; border-color: #10b981; }
    .msg.ai pre { margin: 0; background: var(--code-bg); }
    .msg.ai code { background: rgba(128,128,128,0.15); padding: 2px 5px; border-radius: 4px; font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; }

    /* Input Area */
    .input-area {
      padding: 16px 20px 24px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 15;
    }
    .input-wrapper {
      max-width: 820px; margin: 0 auto; position: relative;
    }
    .input-glass {
      display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px;
      background: var(--glass-bg); backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border: 1px solid var(--glass-border); border-radius: 24px;
      box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-inner);
      transition: all var(--transition);
    }
    .input-glass:focus-within { border-color: var(--accent); box-shadow: 0 4px 20px var(--accent-glow), inset 0 1px 0 var(--glass-inner); transform: translateY(-2px); }
    textarea {
      flex: 1; background: transparent; border: none; outline: none; resize: none;
      color: var(--text-primary); font-family: var(--font-stack); font-size: 15px;
      max-height: 160px; padding: 8px 0; line-height: 1.5; scrollbar-width: none;
    }
    textarea::-webkit-scrollbar { display: none; }
    #sendBtn {
      background: var(--accent); color: white; border: none; border-radius: 14px;
      width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer;
      transition: all var(--transition); flex-shrink: 0;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    #sendBtn:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.1); }
    #sendBtn:active:not(:disabled) { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Modal */
    dialog {
      border: none; border-radius: var(--radius-lg); padding: 24px;
      background: var(--glass-bg); backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--glass-border); box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      width: 340px; max-width: 92%; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: var(--text-primary);
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalPop { from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    dialog::backdrop { background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    dialog h2 { margin-bottom: 18px; font-size: 17px; font-weight: 600; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary); font-weight: 500; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--glass-border);
      background: var(--code-bg); color: var(--text-primary); outline: none; font-family: inherit; font-size: 14px;
      transition: border var(--transition);
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    dialog .btn { width: 100%; margin-top: 4px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute; height: 100%; width: 280px; transform: translateX(-100%);
        background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-right: 1px solid var(--glass-border);
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-toggle { display: flex; align-items: center; justify-content: center; }
      .msg { max-width: 92%; }
      .input-area { padding: 12px 16px 20px; }
      .topbar { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app">
    <aside class="sidebar glass" id="sidebar">
      <div class="sidebar-header">
        <button class="btn" id="newChatBtn">+ New Chat</button>
      </div>
      <div class="chat-list" id="chatList"></div>
      <div class="sidebar-header">
        <button class="btn ghost" id="openSettings">⚙ Settings</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar glass">
        <button class="mobile-toggle" id="toggleSidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <span id="chatTitle">Untitled</span>
        <span style="font-size:11px; color:var(--text-muted);">Liquid UI</span>
      </header>

      <div id="messages"></div>

      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-glass">
            <textarea id="userInput" placeholder="Message..." rows="1"></textarea>
            <button id="sendBtn" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <dialog id="settingsDialog">
    <h2>Preferences</h2>
    <div class="form-group">
      <label>OpenRouter API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-or-...">
    </div>
    <div class="form-group">
      <label>Appearance</label>
      <select id="themeSelect">
        <option value="dark">Dark Glass</option>
        <option value="light">Light Glass</option>
      </select>
    </div>
    <button class="btn" id="saveSettings">Save Changes</button>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/markdown.min.js"></script>

  <script>
    const DEFAULT_API_KEY = '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';
    const MODEL = 'meta-llama/llama-3.1-8b-instruct:free';
    
    let state = {
      activeChat: null,
      chats: {},
      apiKey: localStorage.getItem('lc_apikey') || DEFAULT_API_KEY,
      theme: localStorage.getItem('lc_theme') || 'dark'
    };

    const chatListEl = document.getElementById('chatList');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatTitleEl = document.getElementById('chatTitle');
    const sidebar = document.getElementById('sidebar');
    const settingsDialog = document.getElementById('settingsDialog');

    function init() {
      applyTheme(state.theme);
      document.getElementById('apiKeyInput').value = state.apiKey;
      document.getElementById('themeSelect').value = state.theme;
      
      const saved = localStorage.getItem('lc_chats');
      state.chats = saved ? JSON.parse(saved) : {};
      
      if (!state.activeChat || !state.chats[state.activeChat]) createChat();
      else loadChat(state.activeChat);
      renderChatList();
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      state.theme = theme;
      localStorage.setItem('lc_theme', theme);
      const hlLink = document.querySelector('link[href*="highlight.js"]');
      if (hlLink) {
        hlLink.href = theme === 'dark' 
          ? 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css'
          : 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css';
      }
    }

    function createChat() {
      const id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
      state.chats[id] = { title: 'New Conversation', messages: [] };
      state.activeChat = id;
      saveChats();
      renderChatList();
      loadChat(id);
    }

    function loadChat(id) {
      state.activeChat = id;
      messagesEl.innerHTML = '';
      const chat = state.chats[id];
      chatTitleEl.textContent = chat.title;
      chat.messages.forEach(msg => addMessage(msg.role, msg.content, false));
      renderChatList();
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }

    function deleteChat(id, e) {
      e.stopPropagation();
      if (!confirm('Delete chat?')) return;
      delete state.chats[id];
      if (state.activeChat === id) {
        const keys = Object.keys(state.chats);
        state.activeChat = keys.length ? keys[keys.length - 1] : null;
        state.activeChat ? loadChat(state.activeChat) : createChat();
      }
      saveChats();
      renderChatList();
    }

    function saveChats() {
      localStorage.setItem('lc_chats', JSON.stringify(state.chats));
    }

    function renderChatList() {
      chatListEl.innerHTML = '';
      Object.keys(state.chats).reverse().forEach(id => {
        const div = document.createElement('div');
        div.className = `chat-item ${id === state.activeChat ? 'active' : ''}`;
        div.innerHTML = `<span>${state.chats[id].title}</span><button class="del">✕</button>`;
        div.onclick = () => loadChat(id);
        div.querySelector('.del').onclick = (e) => deleteChat(id, e);
        chatListEl.appendChild(div);
      });
    }

    function addMessage(role, content, isStreaming = false) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (isStreaming) div.textContent = '…';
      else if (role === 'ai') div.innerHTML = renderMarkdown(content);
      else div.textContent = content;
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function renderMarkdown(text) {
      const renderer = new marked.Renderer();
      renderer.code = function(code, language) {
        const lang = language && hljs.getLanguage(language) ? language : 'plaintext';
        const highlighted = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
        return `
          <div class="code-container">
            <div class="code-header">
              <span>${lang}</span>
              <button class="code-copy" onclick="copyCode(this)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy
              </button>
            </div>
            <pre><code class="hljs ${lang}">${highlighted}</code></pre>
          </div>`;
      };
      marked.setOptions({ breaks: true, gfm: true, renderer });
      return marked.parse(text);
    }

    window.copyCode = function(btn) {
      const code = btn.closest('.code-container').querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied';
        btn.classList.add('copied');
        setTimeout(() => { 
          btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
          btn.classList.remove('copied'); 
        }, 1800);
      });
    };

    function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !state.apiKey) return;
      if (!state.apiKey.startsWith('sk-or-')) { alert('Invalid API Key format'); return; }

      inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;
      addMessage('user', text);

      const chat = state.chats[state.activeChat];
      chat.messages.push({ role: 'user', content: text });

      if (chat.messages.length === 1) {
        chat.title = text.slice(0, 32) + (text.length > 32 ? '…' : '');
        chatTitleEl.textContent = chat.title;
        renderChatList();
      }

      const aiEl = addMessage('ai', '', true);
      let fullResponse = '';

      try {
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.apiKey}`,
            'HTTP-Referer': window.location.href,
            'X-Title': 'Liquid Chat'
          },
          body: JSON.stringify({ model: MODEL, messages: chat.messages, stream: true })
        });

        if (!res.ok) throw new Error(`API ${res.status}`);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const json = JSON.parse(line.slice(6));
                const delta = json.choices?.[0]?.delta?.content || '';
                fullResponse += delta;
                aiEl.innerHTML = renderMarkdown(fullResponse);
                scrollToBottom();
              } catch (e) {}
            }
          }
        }
        chat.messages.push({ role: 'assistant', content: fullResponse });
      } catch (err) {
        aiEl.innerHTML = `<span style="color:#ef4444">Request failed: ${err.message}</span>`;
        aiEl.style.border = '1px dashed rgba(239,68,68,0.5)';
      } finally {
        saveChats();
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    document.getElementById('newChatBtn').onclick = createChat;
    document.getElementById('toggleSidebar').onclick = () => sidebar.classList.toggle('open');
    document.getElementById('openSettings').onclick = () => settingsDialog.showModal();
    document.getElementById('saveSettings').onclick = () => {
      const key = document.getElementById('apiKeyInput').value.trim();
      const theme = document.getElementById('themeSelect').value;
      if (key) { state.apiKey = key; localStorage.setItem('lc_apikey', key); }
      applyTheme(theme);
      settingsDialog.close();
    };
    sendBtn.onclick = sendMessage;
    inputEl.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
    inputEl.oninput = autoResize;

    init();
  </script>
</body>
</html>
